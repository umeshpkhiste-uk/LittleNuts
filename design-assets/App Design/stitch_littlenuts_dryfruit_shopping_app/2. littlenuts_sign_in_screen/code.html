<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>LittleNuts - Welcome Back</title>
<!-- Tailwind CSS v3 CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Font: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            forest: {
              800: '#1b2a26',
              900: '#131e1b',
            },
            harvest: {
              bg: '#fcf9f4',
              card: '#ffffff',
              accent: '#d97706',
              accentHover: '#b45309',
              border: '#f1ece4',
              subtle: '#8a8275'
            }
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-layout">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f3eee7;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
  </style>
<style data-purpose="form-controls">
    /* Remove default focus ring and replace with smooth harvest shadow */
    .custom-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(27, 42, 38, 0.15);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="p-0 sm:p-4 md:p-6 text-stone-800">
<!-- BEGIN: PhoneShellContainer -->
<!-- Container mimicking an iOS device display -->
<main class="w-full max-w-[400px] h-[852px] max-h-screen bg-[#fcf9f4] sm:rounded-[44px] shadow-2xl relative flex flex-col justify-between overflow-hidden border-0 sm:border-[8px] sm:border-[#e9e3d8]" data-purpose="mobile-viewport">
<!-- Top Decorative Elements & Content Wrapper -->
<div class="flex-1 flex flex-col px-6 overflow-y-auto no-scrollbar">
<!-- BEGIN: StatusBar -->
<header class="pt-3 pb-2 flex items-center justify-between text-stone-900 select-none" data-purpose="ios-status-bar">
<span class="text-sm font-semibold tracking-tight ml-2">9:41</span>
<!-- Status Bar Icons (Cellular, WiFi, Battery) -->
<div class="flex items-center space-x-2 mr-2">
<!-- Cellular Signal -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 16 16">
<rect height="4" rx="0.6" width="2.2" x="1" y="11"></rect>
<rect height="7" rx="0.6" width="2.2" x="4.6" y="8"></rect>
<rect height="10" rx="0.6" width="2.2" x="8.2" y="5"></rect>
<rect height="13" rx="0.6" width="2.2" x="11.8" y="2"></rect>
</svg>
<!-- WiFi -->
<svg class="w-4 h-4 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
<path d="M8.53 16.11a6 6 0 016.95 0M4.93 12.5a10 10 0 0114.14 0M1.34 8.89a14 14 0 0121.32 0M12 20h.01" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Battery -->
<svg class="w-5 h-4 stroke-current stroke-1 fill-none" viewBox="0 0 24 16">
<rect class="stroke-2" height="14" rx="3.5" width="18" x="1" y="1"></rect>
<rect class="fill-current stroke-none" height="10" rx="1.5" width="12" x="3" y="3"></rect>
<path class="stroke-2" d="M21 6v4" stroke-linecap="round"></path>
</svg>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: NavigationBar -->
<nav aria-label="Main Navigation" class="pt-3 pb-4 flex items-center justify-between">
<!-- Back Navigation Button -->
<button aria-label="Go Back" class="w-10 h-10 rounded-full bg-white border border-[#eae3d5] shadow-xs flex items-center justify-center text-stone-700 hover:bg-stone-50 transition active:scale-95" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</button>
<!-- Screen / Flow Context Tag -->
<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold tracking-wide bg-[#f2ecdf] text-forest-800 uppercase">
          Auth • Sign In
        </span>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: HeadingSection -->
<section class="mt-4 mb-7" data-purpose="screen-header">
<h1 class="text-3xl font-extrabold text-forest-800 tracking-tight leading-snug">
          Welcome back
        </h1>
<p class="mt-2 text-[14px] text-stone-500 font-medium leading-relaxed">
          Access your account for seamless shopping for fresh, roasted and raw artisanal dry fruits.
        </p>
</section>
<!-- END: HeadingSection -->
<!-- BEGIN: LoginForm -->
<form class="space-y-4" data-purpose="sign-in-form" onsubmit="event.preventDefault();">
<!-- Email Input Field -->
<div>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-stone-400">
<!-- Mail Icon -->
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="custom-input w-full pl-12 pr-4 py-3.5 bg-white border border-[#e8dfcf] rounded-2xl text-[14.5px] text-stone-800 placeholder-stone-400 transition" id="email" name="email" placeholder="Email Address" required="" type="email" value="alex.turner@organicmail.com">
</div>
</div>
<!-- Password Input Field -->
<div>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-stone-400">
<!-- Lock Icon -->
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="custom-input w-full pl-12 pr-12 py-3.5 bg-white border border-[#e8dfcf] rounded-2xl text-[14.5px] text-stone-800 placeholder-stone-400 transition tracking-wider" id="password" name="password" placeholder="Password" required="" type="password" value="••••••••••••">
<!-- Password Toggle Visibility Icon -->
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-4 flex items-center text-stone-400 hover:text-stone-600 focus:outline-none" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Options: Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-1 pb-1">
<label class="flex items-center cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-forest-800 border-stone-300 focus:ring-forest-800 focus:ring-offset-0 focus:ring-1 cursor-pointer" type="checkbox">
<span class="ml-2 text-xs font-medium text-stone-600">Save password</span>
</label>
<a class="text-xs font-semibold text-amber-700 hover:text-amber-800 hover:underline" href="#">
            Forgot password?
          </a>
</div>
<!-- Primary Sign In Action Button -->
<button class="w-full py-4 mt-2 bg-[#1b2a26] hover:bg-[#131e1b] text-white font-bold text-[15px] rounded-2xl shadow-md shadow-emerald-950/20 active:scale-[0.99] transition duration-150 flex items-center justify-center gap-2" data-purpose="submit-button" type="submit">
<span class="">Sign In</span>
</button>
</form>
<!-- END: LoginForm -->
<!-- BEGIN: SocialAuthSection -->
<section class="mt-6 mb-6 text-center" data-purpose="social-login">
<!-- Text Divider -->
<div class="relative flex items-center justify-center my-4">
<div class="border-t border-[#eae2d3] w-full"></div>
<span class="bg-[#fcf9f4] px-3 text-xs font-medium text-stone-400 uppercase tracking-wider">Or continue with</span>
<div class="border-t border-[#eae2d3] w-full"></div>
</div>
<!-- Social Action Buttons -->
<div class="flex flex-col space-y-3 mt-4">
<!-- Google Authentication Button -->
<button class="w-full py-3.5 px-4 bg-white hover:bg-stone-50 border border-[#e8dfcf] rounded-2xl flex items-center justify-center space-x-3 text-sm font-semibold text-stone-700 shadow-2xs active:scale-[0.99] transition" type="button">
<!-- Google "G" Logo SVG -->
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.87c2.26-2.09 3.67-5.17 3.67-9.15z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3.05c-1.08.72-2.45 1.16-4.06 1.16-3.13 0-5.78-2.11-6.73-4.96H1.27v3.15C3.25 21.31 7.31 24 12 24z" fill="#34A853"></path>
<path d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24 0-.75.13-1.52.38-2.24V6.61H1.27C.46 8.23 0 10.06 0 12c0 1.94.46 3.77 1.27 5.39l4-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.69 1.27 6.61l4 3.15c.95-2.85 3.6-4.96 6.73-4.96z" fill="#EA4335"></path>
</svg>
<span class="">Continue with Google</span>
</button>
<!-- Apple Authentication Button -->

</div>
</section>
<!-- END: SocialAuthSection -->
</div>
<!-- End content scrollable area -->
<!-- BEGIN: Footer -->
<footer class="pb-8 pt-3 text-center bg-[#fcf9f4] border-t border-[#f2ebd9]" data-purpose="screen-footer">
<p class="text-xs text-stone-500 font-medium">
        Don't have an account? 
        <a class="text-stone-900 font-bold hover:text-amber-700 underline underline-offset-2 ml-1" href="#">
          Sign Up.
        </a>
</p>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-stone-300 rounded-full mx-auto mt-4"></div>
</footer>
<!-- END: Footer -->
</main>
<!-- END: PhoneShellContainer -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="interaction-handlers">
    // Lightweight toggle for password mask
    document.addEventListener('DOMContentLoaded', () => {
      const passwordInput = document.getElementById('password');
      const toggleBtn = passwordInput?.nextElementSibling;

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        });
      }
    });
  </script>
<!-- END: InteractiveScripts -->


</body></html>
